{% extends "base.html" %}

{% block title %}Create Account – GameShelf{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-5 col-md-7">
      <div class="p-4 p-md-5 rounded-4 border border-subtle shadow-lg" style="background-color: var(--bg-card);">
        <div class="text-center mb-4">
          <div class="brand-icon mx-auto mb-3" style="width: 48px; height: 48px;">
            <i class="bi bi-person-plus text-white fs-4"></i>
          </div>
          <h2 class="fw-bold text-white mb-1">Create an Account</h2>
          <p class="text-secondary small">Join the community to rate, review, and track video games</p>
        </div>

        <form action="{{ url_for('auth.register') }}" method="POST">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

          <div class="mb-3">
            <label class="form-label text-secondary small fw-bold text-uppercase">Username</label>
            <div class="input-group">
              <span class="input-group-text bg-secondary border-0 text-muted"><i class="bi bi-person"></i></span>
              <input type="text" name="username" class="form-control form-control-gaming" placeholder="e.g. shadow_stalker" value="{{ username or '' }}" required autofocus>
            </div>
            <div class="text-muted small mt-1" style="font-size: 0.75rem;">Alphanumeric and underscores only (3-30 chars).</div>
          </div>

          <div class="mb-3">
            <label class="form-label text-secondary small fw-bold text-uppercase">Email Address</label>
            <div class="input-group">
              <span class="input-group-text bg-secondary border-0 text-muted"><i class="bi bi-envelope"></i></span>
              <input type="email" name="email" class="form-control form-control-gaming" placeholder="you@domain.com" value="{{ email or '' }}" required>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label text-secondary small fw-bold text-uppercase">Password</label>
            <div class="input-group">
              <span class="input-group-text bg-secondary border-0 text-muted"><i class="bi bi-lock"></i></span>
              <input type="password" name="password" class="form-control form-control-gaming" placeholder="Minimum 6 characters" required>
            </div>
          </div>

          <div class="mb-4">
            <label class="form-label text-secondary small fw-bold text-uppercase">Confirm Password</label>
            <div class="input-group">
              <span class="input-group-text bg-secondary border-0 text-muted"><i class="bi bi-lock-fill"></i></span>
              <input type="password" name="confirm_password" class="form-control form-control-gaming" placeholder="Repeat your password" required>
            </div>
          </div>

          <button type="submit" class="btn btn-primary-gaming w-100 py-2 mb-3">
            <i class="bi bi-check2-circle me-1"></i> Register Free Account
          </button>
        </form>

        <div class="text-center mt-3 pt-3 border-top border-subtle">
          <p class="text-secondary small mb-0">
            Already have an account? 
            <a href="{{ url_for('auth.login') }}" class="text-info fw-semibold">Sign In</a>
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
