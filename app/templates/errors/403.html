{% extends "base.html" %}

{% block title %}403 – Access Denied – GameShelf{% endblock %}

{% block content %}
<div class="container py-5 text-center my-auto">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="p-5 rounded-4 border border-subtle" style="background-color: var(--bg-card);">
        <div class="display-1 fw-extrabold text-danger mb-2">403</div>
        <h3 class="fw-bold text-white mb-2">Access Restricted</h3>
        <p class="text-secondary small mb-4">{{ error.description if error and error.description else 'You do not have the required clearance level to access this sector.' }}</p>
        <a href="{{ url_for('games.index') }}" class="btn btn-primary-gaming">
          <i class="bi bi-house-door me-1"></i> Return to Safety
        </a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
